[project]
name = "shipshape"
version = "1.0.0"
description = "Security checks for Dockerfiles and Kubernetes manifests, built on the five-factor container security model"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
shipshape = "shipshape.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["shipshape", "shipshape.rules"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]  # the formatter wraps code; long strings (CSS, YAML in tests) stay readable on one line
